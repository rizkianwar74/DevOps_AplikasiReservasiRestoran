apiVersion: apps/v1

kind: Deployment

metadata:

  name: resto-deployment

spec:

  replicas: 1

  selector:

    matchLabels:

      app: resto

  template:

    metadata:

      labels:

        app: resto

    spec:

      containers:

      - name: resto-app

        image: mylyyyyy/resto-app:v1  

        ports:

        - containerPort: 3000

        resources: # Wajib ada untuk HPA nanti

          requests:

            cpu: "100m"

          limits:

            cpu: "500m"

---

apiVersion: v1

kind: Service

metadata:

  name: resto-service

spec:

  type: LoadBalancer

  selector:

    app: resto

  ports:

  - port: 80

    targetPort: 3000